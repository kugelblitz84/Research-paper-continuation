[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-cancer-continuation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "torchvision", "numpy", "pandas", "scipy", "scikit-learn", "Pillow", "PyYAML", "matplotlib"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
